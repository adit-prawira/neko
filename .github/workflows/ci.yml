name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simd:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64-avx2
          - os: macos-latest
            name: macos-arm64-neon
    name: simd (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: build & test
        run: make -f simd/Makefile test

  engine:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
    name: engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: check formatting
        run: cargo fmt -- --check
        working-directory: engine

      - name: build
        run: cargo build
        working-directory: engine

      - name: test
        run: cargo test
        working-directory: engine

  cli:
    name: Go CLI/TUI and Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.3

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: install protoc-gen-go-grpc
        run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: install protoc-gen-doc
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

      - name: add go bin to path
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: go mod download
        run: go mod download

      - name: build
        run: make build

      - name: test
        run: CGO_LDFLAGS="-L$PWD/engine/target/release -lneko_engine -Wl,-rpath,$PWD/engine/target/release" go test ./...

      - name: verify
        run: ./neko version | grep "neko v0.1.0"
