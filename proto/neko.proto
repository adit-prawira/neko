syntax = "proto3";

package neko.v1;

option go_package = "github.com/adit-prawira/neko/internal/gen/neko/v1;nekov1";

import "google/protobuf/empty.proto";

enum Metric {
  METRIC_UNSPECIFIED = 0;
  METRIC_L2 = 1;
  METRIC_COSINE = 2;
  METRIC_DOT = 3;
}

message CreateCollectionRequest {
  string name = 1;
  uint32 dim = 2;
  Metric metric = 3;
}

message GetCollectionRequest { string name = 1; }

message DropCollectionRequest { string name = 1; }

message SearchQueryParams {
  repeated float vector = 1;
  optional uint32 top_k = 2;
  bytes filter = 3;
}

message SearchRequest {
  string name = 1;
  SearchQueryParams query = 2;
}

message ScoredResult {
  string id = 1;
  float score = 2;
}

message SearchResponse { repeated ScoredResult results = 1; }

message CollectionResponse {
  string name = 1;
  uint32 dim = 2;
  Metric metric = 3;
  uint64 vector_count = 4;
  uint64 storage_bytes = 5;
}

message CollectionsResponse { repeated CollectionResponse collections = 1; }

message CreateCollectionResponse {
  string name = 1;
  uint32 dim = 2;
  Metric metric = 3;
}

service CollectionService {
  // Create creates a new collection with the given name, dimension, and distance metric.
  rpc Create(CreateCollectionRequest) returns (CreateCollectionResponse);
  // List returns metadata for every collection.
  rpc List(google.protobuf.Empty) returns (CollectionsResponse);
  // Get returns metadata for a single collection by name.
  rpc Get(GetCollectionRequest) returns (CollectionResponse);
  // Drop removes a collection and its on-disk data.
  rpc Drop(DropCollectionRequest) returns (google.protobuf.Empty);
  // Search runs top-K nearest-neighbor search against a collection's vectors.
  rpc Search(SearchRequest) returns (SearchResponse);
};

message UpsertVector {
  string id = 1;
  repeated float vector = 2;
  string metadata = 3;
}

message UpsertVectorRequest {
  string name = 1;
  string id = 2;
  UpsertVector body = 3;
}

message UpsertVectorResponse {
  string id = 1;
  uint32 dim = 2;
}

message InsertVectorRequest {
  string name = 1;
  UpsertVector body = 2;
}

message InsertManyVectorRequest {
  string name = 1;
  repeated UpsertVector vectors = 2;
}

message InsertManyVectorResponse {
  repeated string ids = 1;
  int32 inserted = 2;
  uint32 dim = 3;
}

message GetVectorRequest {
  string name = 1;
  string id = 2;
}

message GetVectorResponse {
  string id = 1;
  repeated float vector = 2;
  string metadata = 3;
}

message DeleteVectorRequest {
  string name = 1;
  string id = 2;
}

service VectorService {
  // Insert stores a single vector; returns AlreadyExists if the id is taken.
  rpc Insert(InsertVectorRequest) returns (UpsertVectorResponse);
  // InsertMany batch-inserts vectors (cap 10,000 per REST handler).
  rpc InsertMany(InsertManyVectorRequest) returns (InsertManyVectorResponse);
  // Get returns the vector + metadata for a single id.
  rpc Get(GetVectorRequest) returns (GetVectorResponse);
  // Upsert inserts a vector or replaces it if the id already exists.
  rpc Upsert(UpsertVectorRequest) returns (UpsertVectorResponse);
  // Delete removes a vector by id.
  rpc Delete(DeleteVectorRequest) returns (google.protobuf.Empty);
}
